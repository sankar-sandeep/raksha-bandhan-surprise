<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Raksha Bandhan ❤️</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="./styles.css">
</head>


<body>

    <!-- Floating decorations -->

    <div class="floating-elements">

        <span>❤️</span>
        <span>✨</span>
        <span>🌸</span>
        <span>💗</span>
        <span>✨</span>
        <span>🌸</span>
        <span>❤️</span>
        <span>💫</span>

    </div>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            🪷 For My Sister
        </div>

        <div class="nav-rakhi">
            🪷
        </div>

    </nav>


    <!-- Main Hero -->

    <section class="hero">

        <div class="hero-content">


            <!-- Decoration -->

            <div class="top-decoration">
                ✨ ───── 🌸 ───── ✨
            </div>


            <!-- Small Heading -->

            <div class="small-heading">
                A LITTLE SURPRISE FOR YOU
            </div>


            <!-- Main Heading -->

            <h1>

                Happy

                <span>
                    Raksha Bandhan
                </span>

            </h1>


            <!-- Rakhi -->

            <div class="rakhi-icon">

                <img
                    src="images/rakhi.png"
                    alt="Beautiful Raksha Bandhan Rakhi">

            </div>


            <!-- Sister Text -->

            <h2>
                To My Beautiful Sister ❤️
            </h2>


            <!-- Description -->

            <p class="hero-description">

                Some bonds are created by destiny,
                but the bond between a brother and
                sister is something truly magical.

            </p>


            <p class="hero-description special-line">

                So today, I made something special...

            </p>


            <!-- Surprise Button -->

            <a
                href="surprise.html"
                class="surprise-button">

                <span>🎁</span>

                Open Your Surprise

                <span>✨</span>

            </a>


        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
